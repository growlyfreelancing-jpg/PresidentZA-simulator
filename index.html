<script>
const $=i=>document.getElementById(i),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),f1=n=>n.toFixed(1),sum=a=>a.reduce((x,y)=>x+y,0),KEY="president-sa-save-v1";
const SEC=[["Energy","Electricity, industry, growth","Capex"],["Transport","Trade, costs, jobs","Capex"],["Education","Skills, unemployment","Opex"],["Healthcare","Workforce, approval","Opex"],["Industry","GDP, exports, jobs","Capex"],["Safety & Security","Crime, investors, integrity","Opex"],["Agriculture","Food prices, rural jobs","Capex"],["Finance","Investor trust, growth","Opex"],["Housing & Social","Poverty, approval","Capex"],["Environment & Water","Water security, farms","Capex"]];

const EV=[
{id:"ls",k:"Infrastructure",t:"Stage 6 load-shedding",d:"Grid failures black out cities and industry demands action.",w:3,c:(s,I)=>I.elec<56,ch:[{t:"Emergency diesel generation",fx:{cost:15,ap:2,d:{0:2}}},{t:"Appeal to the public to conserve",fx:{ap:-4,inv:-4},lt:{n:2,fx:{sh:-.3}}}]},
{id:"dr",k:"Society",t:"Severe drought",d:"Dams run low and farmers warn of lost harvests.",w:2,c:(s,I)=>I.water<66,ch:[{t:"Fund farmer relief",fx:{cost:10,ap:2,d:{6:1}}},{t:"Let markets adjust",fx:{ap:-2,d:{6:-4}},lt:{n:2,fx:{inf:.8}}}]},
{id:"rc",k:"Economy",t:"Global recession",d:"Trade partners slow sharply and export orders fall.",w:1.5,c:s=>s.q>=2,ch:[{t:"Fiscal stimulus",fx:{cost:20,sh:-.6,ap:1}},{t:"Hold the line",fx:{sh:-1.5,ap:-3,inv:2}}]},
{id:"mn",k:"Economy",t:"Major mineral discovery",d:"Geologists confirm a large deposit in the Northern Cape.",w:1,c:()=>true,ch:[{t:"State-led development",fx:{cost:8,ap:3},lt:{n:3,fx:{sh:.6}}},{t:"Open to private licences",fx:{inv:6},lt:{n:2,fx:{sh:.4}}}]},
{id:"sc",k:"Politics",t:"Procurement scandal",d:"Reports link a minister’s department to inflated contracts.",w:3,c:s=>s.effi<55,ch:[{t:"Dismiss the minister",fx:{coal:-5,ef:6,ap:2}},{t:"Defend the minister",fx:{ap:-6,ef:-4,inv:-4}}]},
{id:"pr",k:"Society",t:"Mass demonstrations",d:"Crowds march over jobs and services.",w:3,c:s=>s.un>34||s.ap<42,ch:[{t:"Fund a jobs and housing programme",fx:{cost:12,ap:4,d:{8:3}}},{t:"Deploy police to restore order",fx:{ap:-5,d:{5:-1}}}]},
{id:"sk",k:"Politics",t:"Public-sector strike",d:"Unions down tools over wages.",w:1.5,c:()=>true,ch:[{t:"Grant a wage settlement",fx:{cost:10,ap:3},lt:{n:2,fx:{inf:.4}}},{t:"Hold firm",fx:{sh:-.4,ap:-3,coal:-3}}]},
{id:"oil",k:"International",t:"Oil price shock",d:"Fuel prices spike on global markets.",w:1.2,c:()=>true,ch:[{t:"Subsidise fuel",fx:{cost:12,ap:1}},{t:"Pass costs through",fx:{inf:1.2,ap:-3,sh:-.2}}]},
{id:"co",k:"Politics",t:"Coalition partner threatens to walk",d:"A junior partner demands more influence or will leave.",w:4,c:s=>s.coal<45,ch:[{t:"Concede a portfolio",fx:{coal:15,ef:-3}},{t:"Call their bluff",fx:{coal:-10,ap:1}}]},
{id:"wc",k:"Society",t:"Municipal water crisis",d:"Pipes fail and taps run dry in several metros.",w:3,c:(s,I)=>I.water<48,ch:[{t:"Emergency pipeline repairs",fx:{cost:10,ap:2,d:{9:4}}},{t:"Impose water restrictions",fx:{ap:-4,d:{6:-2}}}]},
{id:"te",k:"International",t:"Global technology breakthrough",d:"A new technology wave reshapes industry worldwide.",w:1,c:()=>true,ch:[{t:"Fund digital skills",fx:{cost:5,d:{2:3,4:2}},lt:{n:3,fx:{sh:.3}}},{t:"Wait and see",fx:{inv:1}}]},
{id:"fd",k:"Economy",t:"Food price spike",d:"Staple prices climb and households feel the squeeze.",w:2,c:(s,I)=>I.agri<48,ch:[{t:"Food subsidy",fx:{cost:8,ap:2}},{t:"Do nothing",fx:{ap:-3,inf:1}}]}];
let S=null,tab="dash",dfSel="normal",how=false;
const ind=s=>{const e=s.eff;return{elec:25+.75*e[0],infra:e[1],edu:e[2],he:e[3],ind:e[4],sec:e[5],agri:e[6],fin:e[7],hou:e[8],water:e[9]}};
const dg=s=>s.debt/(s.gdp*s.pl*1000)*100;
const snap=(s,def)=>({g:s.g,un:s.un,inf:s.inf,ap:s.ap,par:s.par,inv:s.inv,dg:dg(s),gdp:s.gdp*s.pl,elec:ind(s).elec,def});
function fresh(df){const D=DIFF[df],s={v:1,df,q:0,gdp:7.2,pl:1,g:D.g,un:32,inf:5.5,debt:D.debt,ap:D.ap,inv:55,dev:[...DEV0],eff:[...DEV0],coal:65,par:57,effi:50,tax:0,borrowed:0,alloc:Array(10).fill(0),shock:0,infS:0,pend:[],hist:[],news:[],low:0,last:{},stage:null,rep:null,ev:null,done:null,tip:true};s.hist.push(snap(s,50));return s}
function fin(s){const rev=500*(s.gdp/7.2)*s.pl*(1+.07*s.tax)*(1-(s.un-32)/250),interest=s.debt*.0105*(1+Math.max(0,50-s.inv)/200),base=493*Math.pow(1.003,s.q)*s.pl;return{rev,interest,base,disc:35*DIFF[s.df].d*rev/500+s.borrowed}}
function fit(){const d=fin(S).disc,t=sum(S.alloc);if(t>d)S.alloc=S.alloc.map(a=>Math.floor(a*d/t*2)/2)}
function apply(s,x){const D=DIFF[s.df],m=a=>a<0?a*D.sev:a;
if(x.ap)s.ap=cl(s.ap+m(x.ap),5,90);if(x.inv)s.inv=cl(s.inv+m(x.inv),0,100);if(x.coal)s.coal=cl(s.coal+m(x.coal),0,100);if(x.ef)s.effi=cl(s.effi+m(x.ef),5,95);
if(x.sh)s.shock+=m(x.sh);if(x.inf)s.infS+=x.inf>0?x.inf*D.sev:x.inf;if(x.cost)s.debt+=x.cost;

function warnings(s){const I=ind(s),h=s.hist,pu=h.length>1?h[h.length-2].un:s.un,w=[];
if(I.elec<55)w.push("Electricity supply deteriorating ("+Math.round(I.elec)+"/100)");if(s.un>pu+.05)w.push("Unemployment increasing ("+f1(s.un)+"%)");
if(dg(s)>90)w.push("National debt becoming unsustainable ("+f1(dg(s))+"% of GDP)");if(s.ap<40)w.push("Public approval declining ("+Math.round(s.ap)+"%)");
if(I.water<45)w.push("Water shortages emerging");if(s.par<45)w.push("Parliamentary support is fragile ("+Math.round(s.par)+"%)");if(s.inv<45)w.push("Investor confidence is weak");return w}
function pickEv(s,I){if(Math.random()>.65)return null;const c=EV.filter(e=>e.c(s,I)&&(s.last[e.id]===undefined||s.q-s.last[e.id]>4));if(!c.length)return null;let r=Math.random()*sum(c.map(e=>e.w));for(const e of c){r-=e.w;if(r<=0)return e.id}return c[0].id}
function sim(s){const D=DIFF[s.df],p=snap(s,0),I0=ind(s);
s.pend=s.pend.filter(x=>{if(x.at<=s.q){apply(s,x.fx);return false}return true});
const f=fin(s),al=sum(s.alloc),spend=f.base+f.interest+al,bal=f.rev-spend;

s.eff=s.eff.map((e,i)=>e+.35*(s.dev[i]-e));
const I=ind(s),d0=dg(s);
const gt=[["Electricity",.03*(I.elec-65)],["Transport",.025*(I.infra-50)],["Skills",.02*(I.edu-55)],["Industry",.015*(I.ind-50)],["Finance sector",.012*(I.fin-50)],["Investor confidence",.02*(s.inv-55)],["Workforce health",.01*(I.he-55)],["Tax stance",-.3*s.tax],["Debt burden",-.012*Math.max(0,d0-90)],["External shocks",s.shock]];
s.g=cl(.6*s.g+.4*(1.2-(D.sev-1)+sum(gt.map(x=>x[1]))),-6,7);s.gdp*=1+s.g/400;s.shock*=.6;

const at=[["Unemployment",-.8*(s.un-32)],["Inflation",-1.5*(s.inf-5.5)],["Healthcare",.15*(I.he-55)],["Education",.15*(I.edu-55)],["Electricity",.2*(I.elec-65)],["Housing",.2*(I.hou-45)],["Safety",.15*(I.sec-40)],["Water",.1*(I.water-55)],["Debt burden",-.08*Math.max(0,dd-80)],["Tax stance",-2.5*s.tax]];

const n=[],add=(c,t)=>n.push({c,t,q:s.q});

const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1&&DIFF[d.df]&&[d.dev,d.eff,d.alloc].every(a=>Array.isArray(a)&&a.length===10)&&Array.isArray(d.hist)&&d.hist.length&&typeof d.q==="number"&&[d.gdp,d.debt,d.ap,d.un,d.pl].every(Number.isFinite)){if(d.done&&!d.stage)d.stage="end";return d}}catch(e){}return null};

function begin(){S=fresh(dfSel);tab="dash";save();render()}
function cont(){const d=load();if(d){S=d;tab="dash";render()}}
function menu(wipe){if(wipe)try{localStorage.removeItem(KEY)}catch(e){}else save();S=null;render()}
function endQ(){if(S.stage||S.done)return;sim(S);save();render();scrollTo(0,0)}
function after(){if(S.stage==="rep")S.stage=S.ev?"ev":S.done?"end":null;else S.stage=S.done?"end":null;if(S.stage==="end")try{localStorage.removeItem(KEY)}catch(e){}else save();render();scrollTo(0,0)}
function pick(i){const e=EV.find(x=>x.id===S.ev),c=e.ch[i];apply(S,c.fx);if(c.lt)S.pend.push({at:S.q+c.lt.n,fx:c.lt.fx});S.last[e.id]=S.q;S.news.unshift({c:e.k,t:e.t+": "+c.t+".",q:S.q});S.ev=null;after()}
function setA(i,el){const mx=Math.max(0,fin(S).disc-(sum(S.alloc)-S.alloc[i])),v=Math.min(+el.value,Math.floor(mx*2)/2);el.value=v;S.alloc[i]=v;upd()}
function setTax(t){S.tax=t;fit();save();render()}
function borrow(n){S.borrowed=cl(S.borrowed+n,0,40);fit();save();render()}
function upd(){if(!$("tot"))return;const f=fin(S),t=sum(S.alloc),cap=[0,1,4,6,8,9].reduce((x,i)=>x+S.alloc[i],0);
$("tot").textContent="R"+t.toFixed(1)+"bn of R"+f.disc.toFixed(1)+"bn ("+Math.round(t/f.disc*100)+"%)";$("pb").style.width=Math.min(100,t/f.disc*100)+"%";$("bl").textContent="R"+Math.round(f.disc-t)+"bn";
S.alloc.forEach((a,i)=>$("a"+i).textContent="R"+a.toFixed(1)+"bn");
$("wn").textContent="Capital R"+cap.toFixed(1)+"bn, operational R"+(t-cap).toFixed(1)+"bn. Deficits are financed by new borrowing"+(S.borrowed?" (including R"+S.borrowed+"bn extra).":".")}
function spark(a,c){if(a.length<2)return"";const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1,p=a.map((v,i)=>(i/(a.length-1)*100).toFixed(1)+","+(32-(v-mn)/r*28).toFixed(1)).join(" ");return`<svg viewBox="0 0 100 34" preserveAspectRatio="none" width="100%" height="34"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
const CARD=[["GDP (nominal)","gdp",v=>"R"+v.toFixed(2)+"tn",1],["GDP growth","g",v=>f1(v)+"%",1],["Unemployment","un",v=>f1(v)+"%",0],["Inflation","inf",v=>f1(v)+"%",0],["Debt / GDP","dg",v=>f1(v)+"%",0],["Deficit","def",v=>"R"+Math.round(v)+"bn",0],["Investor confidence","inv",v=>Math.round(v)+"/100",1],["Electricity","elec",v=>Math.round(v)+"/100",1]];
const card=c=>{const h=S.hist,cur=h[h.length-1][c[1]],d=cur-(h.length>1?h[h.length-2][c[1]]:cur),col=Math.abs(d)<.005?"#aaa0e6":(d*(c[3]?1:-1)>0?"#2fe39a":"#ff5a6e");return`<div class="cd"><div class="k">${c[0]}</div><div class="v">${c[2](cur)}</div><div style="color:${col};font-size:11px">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(2)}</div>${spark(h.map(x=>x[c[1]]),col)}</div>`};
function dash(){const f=fin(S),I=ind(S),w=warnings(S),pr=Object.keys(IN).map(k=>[k,I[k]]).sort((a,b)=>a[1]-b[1]).slice(0,3),al=sum(S.alloc);
return(S.tip&&S.q===0?`<div class="cd" style="border-color:var(--au)"><b class="au">How to govern</b><p>1. Open <b>Budget</b> and spread your discretionary money across sectors. Each sector decays without funding and returns diminish as it develops.<br>2. End the quarter and read the report.<br>3. Decide on the national event. Hold parliament’s confidence for 20 quarters to reach the election.</p><button class="bt o" onclick="S.tip=false;render()">Dismiss</button></div>`:"")+
`<h2>NATIONAL STATUS</h2><div class="cd">${w.length?w.map(x=>`<div class="dn">▲ ${x}</div>`).join(""):'<span class="up">No major warnings.</span>'}</div>
<h2>CURRENT PRIORITIES</h2><div class="cd">${pr.map(x=>`<div class="row"><span>Improve ${IN[x[0]].toLowerCase()}</span><b class="dn">${Math.round(x[1])}/100</b></div>`).join("")}</div>
<h2>KEY INDICATORS</h2><div class="gr">${CARD.map(card).join("")}</div>
<h2>NEXT QUARTER PREVIEW</h2><div class="cd"><div class="row"><span class="k">Debt servicing</span><b>R${Math.round(f.interest)}bn</b></div><div class="row"><span class="k">Existing expenditure</span><b>R${Math.round(f.base)}bn</b></div><div class="row"><span class="k">Planned allocation</span><b>R${Math.round(al)}bn</b></div><div class="row"><span class="k">Projected balance</span><b class="${f.rev-f.base-f.interest-al<0?"dn":"up"}">R${Math.round(f.rev-f.base-f.interest-al)}bn</b></div><div class="row"><span class="k">Delayed effects pending</span><b>${S.pend.length}</b></div></div>
<button class="bt" style="width:100%" onclick="endQ()">▶ END QUARTER ${S.q+1}</button>`}
function bud(){const f=fin(S);
return`<div class="cd"><div class="row"><span class="k">Revenue</span><b>R${Math.round(f.rev)}bn</b></div><div class="row"><span class="k">Existing expenditure</span><b>R${Math.round(f.base)}bn</b></div><div class="row"><span class="k">Debt servicing</span><b>R${Math.round(f.interest)}bn</b></div><div class="row"><span class="k">Discretionary budget</span><b class="au">R${Math.round(f.disc)}bn</b></div><div class="row"><span class="k">Allocated</span><b id="tot"></b></div><div class="bar"><i id="pb"></i></div><div class="mu" id="wn"></div></div>
<div class="cd"><div class="row"><b>Borrowing</b><span><button class="bt o" ${S.borrowed?"":"disabled"} onclick="borrow(-10)">−R10bn</button> <button class="bt o" ${S.borrowed>=40?"disabled":""} onclick="borrow(10)">+R10bn</button></span></div><div class="mu">Extra borrowing adds to debt plus a 5% fee and raises future interest.</div></div>
<div class="cd"><b>Tax stance</b><div class="mu">Higher tax lifts revenue but weighs on growth, investors and approval.</div><div style="display:flex;gap:6px;margin-top:6px">${[[-1,"Lower"],[0,"Hold"],[1,"Higher"]].map(x=>`<button class="bt o ${S.tax===x[0]?"s":""}" style="flex:1" onclick="setTax(${x[0]})">${x[1]}</button>`).join("")}</div></div>
<h2>SECTOR ALLOCATIONS</h2>`+SEC.map((s,i)=>`<div class="cd"><div class="row"><b>${s[0]}</b><span><span class="tag">${s[2]}</span><b id="a${i}"></b></span></div><div class="mu">${s[1]} · development ${Math.round(S.dev[i])}</div><div class="bar"><i style="width:${S.dev[i]}%"></i></div><input type="range" min="0" max="20" step=".5" value="${S.alloc[i]}" oninput="setA(${i},this)" onchange="save()"></div>`).join("")+`<button class="bt" style="width:100%" onclick="endQ()">CONFIRM BUDGET &amp; END QUARTER</button>`}
function gApp(g){const s=Object.assign({un:S.un,inf:S.inf,inv:S.inv,dg:dg(S),tax:S.tax},ind(S));return cl(S.ap+sum(g[1].map(([k,w])=>w*(s[k]-REF[k]))),0,100)}
function pol(){const bars=[["Parliamentary support",S.par],["Public approval",S.ap],["Coalition stability",S.coal]];
return`<h2>PARLIAMENT AND POPULARITY</h2>`+bars.map(b=>`<div class="cd"><div class="row"><span>${b[0]}</span><b class="${b[1]>=50?"up":b[1]>=35?"au":"dn"}">${Math.round(b[1])}%</b></div><div class="bar"><i style="width:${b[1]}%;background:${b[1]>=50?"var(--g)":b[1]>=35?"var(--au)":"var(--r)"}"></i></div></div>`).join("")+`<div class="cd mu">${S.par<35?`<b class="dn">No-confidence danger: support has been below 35% for ${S.low} quarter(s). Two in a row ends your presidency.</b>`:"Parliament elects the President, so you need coalition support, not just popularity. Two quarters below 35% triggers a vote of no confidence."}<br>Election in ${20-S.q} quarters.</div>
<h2>PUBLIC OPINION BY GROUP</h2>`+GR.map(g=>{const a=gApp(g);return`<div class="cd"><div class="row"><span>${g[0]}</span><b class="${a>=50?"up":a>=35?"au":"dn"}">${Math.round(a)}%</b></div><div class="bar"><i style="width:${a}%"></i></div></div>`}).join("")+`<h2>GAME</h2><button class="bt o" onclick="menu(false)">Save and return to menu</button> <button class="bt o" onclick="menu(true)">Abandon presidency</button>`}
function news(){return`<h2>NEWS &amp; EVENTS</h2>`+(S.news.length?S.news.map(n=>`<div class="cd"><span class="tag">${n.c}</span><span class="mu">Q${n.q}</span><div>${n.t}</div></div>`).join(""):'<div class="cd mu">No headlines yet. End your first quarter to make the news.</div>')}
const ST=[["GDP growth","g","%",1],["Unemployment","un","%",0],["Inflation","inf","%",0],["Approval","ap","%",1],["Parliament support","par","%",1],["Debt / GDP","dg","%",0],["Investor confidence","inv","",1],["Electricity","elec","",1]];
function repH(){const r=S.rep,f=r.fin;return`<div class="md"><h1 style="font-size:26px;margin:0 0 6px">Quarter ${S.q} complete!</h1>${ST.map(x=>{const d=r.n[x[1]]-r.p[x[1]],c=Math.abs(d)<.05?"mu":d*(x[3]?1:-1)>0?"up":"dn";return`<div class="row"><span>${x[0]}</span><span>${f1(r.p[x[1]])} → <b class="${c}">${f1(r.n[x[1]])}${x[2]}</b></span></div>`}).join("")}
<h2>TREASURY</h2><div class="row"><span>Revenue</span><span>R${Math.round(f.rev)}bn</span></div><div class="row"><span>Spending (incl. R${Math.round(f.int)}bn interest, R${Math.round(f.al)}bn development)</span><span>R${Math.round(f.sp)}bn</span></div><div class="row"><span>Balance</span><b class="${f.bal<0?"dn":"up"}">R${Math.round(f.bal)}bn</b></div>
<h2>WHY IT CHANGED</h2>${r.why.map(x=>`<div class="mu">${x}</div>`).join("")}<h2>CONSIDER NEXT</h2>${r.warn.length?r.warn.slice(0,3).map(x=>`<div class="dn">▲ ${x}</div>`).join(""):'<div class="up">No urgent risks. Keep investing.</div>'}<br><button class="bt" style="width:100%" onclick="after()">CONTINUE</button></div>`}
const fxT=x=>{const r=[],j=(a,l,u)=>a&&r.push(l+" "+(a>0?"+":"")+a+(u||""));if(x.cost)r.push("+R"+x.cost+"bn debt");j(x.ap,"Approval");j(x.inv,"Investors");j(x.coal,"Coalition");j(x.ef,"Efficiency");j(x.sh,"Growth"," pts");j(x.inf,"Inflation"," pts");for(const i in x.d||{})j(x.d[i],SEC[i][0]);return r.join(" · ")};
function evH(){const e=EV.find(x=>x.id===S.ev);return`<div class="md"><span class="tag">${e.k}</span><h1 style="font-size:22px;margin:8px 0">${e.t}</h1><p>${e.d}</p>${e.ch.map((c,i)=>`<button class="bt o" style="width:100%;text-align:left;margin-top:8px" onclick="pick(${i})"><b>${c.t}</b><br><span class="mu">${fxT(c.fx)}${c.lt?" · Later: "+fxT(c.lt.fx):""}</span></button>`).join("")}</div>`}
function endH(){const L=legacy(S),a=S.hist[0],b=S.hist[S.hist.length-1],why={noconf:"Parliament passed a vote of no confidence and your coalition collapsed.",collapse:"Economic and political collapse forced your resignation."}[S.done.why],win=S.ap+.3*(S.par-50)>=45;
return`<div class="md"><b class="au">PRESIDENTIAL LEGACY</b><h1 style="font-size:26px;margin:6px 0">${L.t}</h1><p>${why||(win?"You won re-election: parliament returns you for a second term.":"Your party fell short at the election and you leave office.")}</p><div class="v">${Math.round(L.tot)}<span class="mu" style="font-size:12px"> / 100</span></div>${Object.entries(L.sc).map(([k,v])=>`<div class="row"><span>${k}</span><b>${Math.round(v)}</b></div><div class="bar"><i style="width:${v}%"></i></div>`).join("")}
<h2>START → END</h2>${[["gdp","GDP (R tn)"],["un","Unemployment %"],["inf","Inflation %"],["dg","Debt / GDP %"],["ap","Approval %"],["elec","Electricity"]].map(x=>`<div class="row"><span>${x[1]}</span><span>${f1(a[x[0]])} → <b>${f1(b[x[0]])}</b></span></div>`).join("")}<br><button class="bt" style="width:100%" onclick="menu(true)">START ANOTHER PRESIDENCY</button></div>`}
function startH(){let b="";[30,52,40,78,46,96,60,36,58,118,50,42,70,46,84,40,56,48].forEach((h,i)=>b+=`<rect x="${i*22}" y="${130-h}" width="18" height="${h}"/>`);const has=!!load();
return`<div class="st"><svg viewBox="0 0 400 130" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:0;width:100%;height:42%;fill:#0d1624">${b}</svg><div style="position:relative;max-width:520px;margin:0 auto;width:100%"><h1>PRESIDENT</h1><p class="au" style="font-weight:600">THE FUTURE OF SOUTH AFRICA IS IN YOUR HANDS.</p>
<div class="cd" style="background:#111a27ee"><b>Scenario: A New Beginning</b><p class="mu">You have just been elected President. Transform the nation while keeping the books sustainable and parliament behind you. Figures are fictionalised game values.</p><div style="display:flex;gap:6px">${Object.keys(DIFF).map(k=>`<button class="bt o ${dfSel===k?"s":""}" style="flex:1;text-transform:capitalize" onclick="dfSel='${k}';render()">${k}</button>`).join("")}</div><div class="mu" style="margin-top:6px">${DIFF[dfSel].t}</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><button class="bt" onclick="begin()">▶ NEW GAME</button><button class="bt o" ${has?"":"disabled"} onclick="cont()">CONTINUE GAME</button><button class="bt o" onclick="how=!how;render()">HOW TO PLAY</button></div>${how?`<div class="cd" style="margin-top:8px;background:#111a27ee">Each quarter, split your discretionary budget across ten sectors, optionally borrow or change tax, then end the quarter. Sectors decay without funding, effects arrive with a delay, and sectors feed each other (power drives industry, schools drive jobs, security drives investors). Keep parliament’s support above 35% and survive 20 quarters. The game autosaves every quarter.</div>`:""}</div></div>`}
function render(){const a=$("app");if(!S){a.innerHTML=startH();return}
const f=fin(S),m=S.stage==="rep"?repH:S.stage==="ev"?evH:S.stage==="end"?endH:null;
a.innerHTML=`<div class="hd"><div><small>YEAR ${2027+(Math.min(S.q,19)>>2)} · Q${Math.min(S.q,19)%4+1}</small><b>Quarter ${Math.min(S.q+1,20)}/20</b></div><div><small>DEBT</small><b>R${(S.debt/1000).toFixed(2)}tn</b></div><div><small>BUDGET LEFT</small><b class="au" id="bl">R${Math.round(f.disc-sum(S.alloc))}bn</b></div><div><small>APPROVAL</small><b class="${S.ap>=45?"up":"dn"}">${Math.round(S.ap)}%</b><div class="bar"><i style="width:${S.ap}%;background:${S.ap>=45?"var(--g)":"var(--r)"}"></i></div></div></div><main>${{dash,bud,pol,news}[tab]()}</main><div class="nav">${[["dash","Dashboard","◈"],["bud","Budget","R"],["pol","Politics","⚑"],["news","News","✦"]].map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')"><i>${t[2]}</i>${t[1]}</button>`).join("")}</div>${m?`<div class="ov">${m()}</div>`:""}`;
upd()}
render();
</script></body></html>
